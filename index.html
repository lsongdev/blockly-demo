<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">MicroPython Blocks</title>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="workspace-label">
        <div class="panel-heading">
          <h1 id="workspace-label" data-i18n="blockHeading">Block</h1>
          <div class="code-actions project-actions">
            <button id="open-project" type="button" data-i18n="projectOpen">Open Project</button>
            <button id="save-project" type="button" data-i18n="projectSave">Save Project</button>
          </div>
        </div>
        <input id="project-file" type="file" accept=".json,application/json" hidden>
        <p id="project-status" role="status"></p>
        <div id="workspace">
          <section id="files-panel" class="toolbox-panel" aria-label="Files" hidden>
            <div class="device-files-actions">
              <button id="refresh-files" type="button"></button>
              <button id="add-file" type="button" data-i18n="addFile" disabled>Add File</button>
            </div>
            <input id="local-device-file" type="file" hidden>
            <p class="device-files-note" data-i18n="deviceFilesNote">File operations interrupt and restart the board program.</p>
            <p id="device-files-status" role="status"></p>
            <div class="device-files-directory">
              <button id="files-parent" type="button" data-i18n="filesParent" hidden>Up</button>
              <code id="files-path"></code>
            </div>
            <ul id="device-file-list"></ul>
          </section>
          <section id="libraries-panel" class="toolbox-panel" aria-labelledby="libraries-title" hidden>
            <h3 id="libraries-title" data-i18n="libraries">Libraries</h3>
            <p data-i18n="librariesNote">Python modules saved with this project and uploaded when you flash.</p>
            <button id="add-library" type="button" data-i18n="addLibrary">Add .py File</button>
            <input id="library-file" type="file" accept=".py" hidden>
            <p id="libraries-status" role="status"></p>
            <ul id="library-list"></ul>
          </section>
        </div>
      </section>
      <section class="panel" aria-labelledby="code-label">
        <div class="panel-heading">
          <h2 id="code-label" data-i18n="codeHeading">Code</h2>
          <div class="code-actions">
            <button id="upload" type="button" title="Write to the board and run" data-i18n-title="flashHint" data-i18n="flashButton">flash</button>
            <button id="download" type="button" title="Save main.py" data-i18n-title="downloadHint" data-i18n="downloadButton">download</button>
          </div>
        </div>
        <p id="upload-status" role="status"></p>
        <p id="code-error" role="status"></p>
        <div class="code-sync" id="code-sync" hidden>
          <button id="use-block-code" type="button" data-i18n="useGeneratedCode">Use generated code</button>
        </div>
        <textarea id="python" aria-labelledby="code-label" spellcheck="false"
          autocapitalize="off" autocomplete="off" wrap="off"></textarea>
        <section class="serial-panel" aria-labelledby="serial-label">
          <div class="serial-heading">
            <h3 id="serial-label" data-i18n="serialOutput">Serial output</h3>
            <div class="code-actions">
              <button id="serial-connect" type="button" disabled>Connect</button>
              <button id="serial-clear" type="button" data-i18n="serialClear" disabled>Clear</button>
            </div>
          </div>
          <p id="serial-status" role="status"></p>
          <pre id="serial-output" aria-labelledby="serial-label" tabindex="0"></pre>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
